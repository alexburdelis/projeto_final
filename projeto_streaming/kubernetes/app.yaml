# ================= API =================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-deployment
spec:
  replicas: 2  # são criados 2 pods da API logo na inicialização do cluster
  selector:
    matchLabels:
      app: streamflix-api
  template:
    metadata:
      labels:
        app: streamflix-api
    spec:
      containers:
        - name: api
          image: streamflix-app:v5  # Imagem do container que será usado para criar os pods da API
          imagePullPolicy: Never    # Imagem local
          command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: streamflix-config
          resources:
            requests:
              cpu: 100m
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
spec:
  type: ClusterIP
  selector:
    app: streamflix-api
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000

---
# ================= WORKER =================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: streamflix-worker
  template:
    metadata:
      labels:
        app: streamflix-worker
    spec:
      containers:
        - name: worker
          image: streamflix-app:v5

          imagePullPolicy: Never
          command: ["python", "mensageria/subscriber.py"]
          envFrom:
            - configMapRef:
                name: streamflix-config

---
# ================= HPA (Auto-Scaling da API) =================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-deployment
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70